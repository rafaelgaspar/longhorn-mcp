name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/rafaelgaspar/longhorn-mcp
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=longhorn-mcp
            org.opencontainers.image.description=MCP server for the Longhorn distributed storage manager API
            org.opencontainers.image.source=https://github.com/rafaelgaspar/longhorn-mcp
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Package and push chart
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Package chart
        env:
          VERSION: ${{ needs.docker.outputs.version }}
        run: helm package chart/ --version "$VERSION" --app-version "$VERSION"

      - name: Login to GHCR (helm)
        run: helm registry login ghcr.io --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"

      - name: Login to GHCR (oras)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      # Attach as an OCI referrer on the image manifest (like unifi-thread-route-updater) —
      # discoverable via `oras discover`/the Referrers API, tied to this exact image digest.
      - name: Attach chart to image manifest
        env:
          VERSION: ${{ needs.docker.outputs.version }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          oras attach --artifact-type application/vnd.cncf.helm.chart.content.v1.tar+gzip \
            "ghcr.io/rafaelgaspar/longhorn-mcp@${DIGEST}" \
            "longhorn-mcp-${VERSION}.tgz:application/vnd.cncf.helm.chart.content.v1.tar+gzip"

      # Also push as a standalone, semver-tagged artifact — for Helm versions/tooling
      # that don't support the attach/Referrers convention, and for anyone who wants
      # to `helm install`/`helm pull` a specific version directly.
      - name: Push standalone tagged chart
        env:
          VERSION: ${{ needs.docker.outputs.version }}
        run: helm push "longhorn-mcp-${VERSION}.tgz" oci://ghcr.io/rafaelgaspar/longhorn-mcp/charts

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      # Classic token, not OIDC Trusted Publishing — npm's Trusted Publisher config
      # lives on the package's own settings page, which can't be configured until
      # the package exists on the registry. Once v0.1.0 lands, switch to Trusted
      # Publishing (permissions: id-token: write, no token) and drop NPM_TOKEN.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
