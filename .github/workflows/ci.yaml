name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  chart:
    name: Lint chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - run: helm lint chart/
      - run: helm template longhorn-mcp chart/

  docker:
    name: Build image & scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Single-platform, loaded into the local daemon (not pushed) — this is a
      # PR-time correctness/vulnerability check, not a release artifact. The
      # multi-arch, registry-pushed build happens in release.yaml on tag push.
      - name: Build image (SHA tag)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: ghcr.io/rafaelgaspar/longhorn-mcp:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # scanners: vuln only — secret scanning is already covered by gitleaks.yaml,
      # and misconfig scanning here would flag this repo's own workflow files
      # (unrelated to what's actually inside the image). ignore-unfixed +
      # severity drop the large volume of low/unfixed Debian base-image CVEs
      # that Renovate/apt-get upgrade can't do anything about, so what lands
      # in the Security tab is limited to real, actionable HIGH/CRITICAL findings.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ghcr.io/rafaelgaspar/longhorn-mcp:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
