name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  chart:
    name: Lint chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - run: helm lint chart/
      - run: helm template longhorn-mcp chart/

  docker:
    name: Build image & scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Single-platform, loaded into the local daemon (not pushed) — this is a
      # PR-time correctness/vulnerability check, not a release artifact. The
      # multi-arch, registry-pushed build happens in release.yaml on tag push.
      - name: Build image (SHA tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ghcr.io/rafaelgaspar/longhorn-mcp:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # scanners: vuln only — secret scanning is already covered by gitleaks.yaml,
      # and misconfig scanning here would flag this repo's own workflow files
      # (unrelated to what's actually inside the image). ignore-unfixed +
      # severity drop the large volume of low/unfixed Debian base-image CVEs
      # that Renovate/apt-get upgrade can't do anything about, so what lands
      # in the Security tab is limited to real, actionable HIGH/CRITICAL findings.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: ghcr.io/rafaelgaspar/longhorn-mcp:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
